name: Release

# Push a version tag to publish a release:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Set the version from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          jq --arg v "$VERSION" '.version = $v' mygo.json > mygo.tmp && mv mygo.tmp mygo.json
      - name: Build (Apple Silicon only)
        run: go tool mygo build -platform darwin/arm64
      - name: Package
        run: |
          mkdir dist
          cp "build/darwin-arm64/MonitorBar $VERSION arm64.dmg" "dist/MonitorBar-$VERSION-macos-arm64.dmg"
          ls -l dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "MonitorBar $VERSION" \
            --generate-notes
