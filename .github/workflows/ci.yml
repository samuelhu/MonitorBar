name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build (Apple Silicon only)
        run: go tool mygo build -platform darwin/arm64
      - uses: actions/upload-artifact@v4
        with:
          name: MonitorBar-AppleSilicon
          path: |
            build/darwin-arm64/*.dmg
            build/darwin-arm64/MonitorBar.app
